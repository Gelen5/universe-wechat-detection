  <style>

<body>
  <header><div class="bar"><div><h1>AI 祝福图文生成器</h1><div class="sub">随机类型 · 多条文案 · 图片插入位置可控</div></div><button id="clearKey">清除图片 Key</button></div></header>
  <main>
    <aside class="panel controls">
      <div class="section-title">输出模式</div>
      <div class="seg"><input id="modeArticle" name="mode" type="radio" value="article" checked><label for="modeArticle">文章</label><input id="modeSticker" name="mode" type="radio" value="sticker"><label for="modeSticker">贴图</label></div>
      <div class="section-title">接口</div>
      <label>图片 API Key</label><input id="apiKey" type="password" placeholder="会自动读取主站接口设置里的图片 Key">
      <div class="hint">这里和主站右上角「接口设置」共用同一份图片 Key，只保存在当前浏览器。</div>
      <div class="grid2" style="margin-top:12px"><div><label>Base URL</label><input id="baseUrl" value="https://img.rjm.us.ci"></div><div><label>模型</label><select id="model"><option>gpt-image-1.5</option><option>gpt-image-2</option></select></div></div>

      <div class="section-title">类型（默认随机）</div>
      <div class="grid3">
        <div><label>图片类型</label><select id="imageType"><option value="random">随机</option><option value="beauty" selected>美女早安</option><option value="flower">花卉山水</option><option value="guofeng">国风吉祥</option><option value="health">养生健康</option><option value="festival">节日节气</option><option value="night">晚安祝福</option><option value="quote">每日金句</option><option value="custom">自定义</option></select></div>
        <div><label>标题类型</label><select id="titleType"><option value="random">随机</option><option value="morning" selected>早安问候</option><option value="luck">好运福气</option><option value="health">健康平安</option><option value="festival">节日节气</option><option value="quote">金句标题</option><option value="custom">自定义</option></select></div>
        <div><label>文案类型</label><select id="copyType"><option value="random">随机</option><option value="warm" selected>温柔问候</option><option value="health">健康祝福</option><option value="luck">好运福气</option><option value="moments">朋友圈长文</option><option value="wechat">公众号短文</option><option value="custom">自定义</option></select></div>
      </div>
      <label style="margin-top:12px">自定义类型补充</label><input id="customType" placeholder="例如：佛系莲花、妈妈群祝福、节气海报">

      <div class="section-title">内容</div>
      <div class="grid2"><div><label>主标题</label><input id="title" placeholder="留空则按标题类型随机"></div><div><label>日期</label><input id="date" type="date"></div></div>
      <label style="margin-top:12px">自定义文案（可选，每行或空行分隔为一条）</label><textarea id="customCopy" placeholder="留空则按文案类型自动生成多条文案"></textarea>
      <div class="row" style="margin-top:12px"><label class="check"><input id="showDate" type="checkbox" checked> 显示日期</label><label class="check"><input id="showLunar" type="checkbox" checked> 显示农历</label></div>

      <div class="section-title article-only">文案与图片位置</div>
      <div class="grid3 article-only">
        <div><label>本次生成文案条数</label><input id="copyCount" type="number" min="1" max="8" value="3"></div>
        <div><label>图片插入到第几条</label><input id="imageAt" type="number" min="1" max="8" value="2"></div>
        <div><label>图片在文案的</label><select id="imagePosition"><option value="after" selected>下方</option><option value="before">上方</option></select></div>
      </div>

      <div class="section-title">生成与排版</div>
      <div class="grid3"><div><label>生成图片张数</label><input id="count" type="number" min="1" max="8" value="4"></div><div class="article-only"><label>每行图片数</label><select id="columns"><option>1</option><option>2</option><option>3</option><option selected>4</option></select></div><div><label>图片比例</label><select id="sizeMode"><option value="3:4" selected>3:4 竖图</option><option value="9:16">9:16 手机竖图</option><option value="custom">自定义</option></select></div></div>
      <div class="grid2 custom-size" style="margin-top:12px"><div><label>自定义宽</label><input id="customWidth" type="number" min="256" max="4096" value="1024"></div><div><label>自定义高</label><input id="customHeight" type="number" min="256" max="4096" value="1365"></div></div>
      <div class="actions"><button id="previewBtn">预览提示词</button><button class="primary" id="generateBtn">开始生成</button><button class="danger" id="cancelBtn" hidden>取消生成</button><button id="copyHtmlBtn">复制公众号HTML</button><button id="downloadHtmlBtn">下载HTML</button><button id="downloadTextBtn">下载文案TXT</button><button id="downloadImagesBtn">下载图片说明</button></div>
      <div id="copyWarn" class="warn" hidden></div>
    </aside>
    <section class="panel preview">
      <div class="status"><span id="status">就绪</span><span id="summary"></span><div class="progress-wrap" id="progressWrap" hidden><div class="progress-bar" id="progressBar"></div></div></div>
      <div id="prompt" class="prompt" hidden></div>
      <article id="article" class="article"><h2 id="articleTitle"></h2><div id="articleBody"></div></article>
    </section>
  </main>
  <div class="modal-mask" id="doneModal" hidden>
    <div class="modal">
      <h3 id="modalTitle">生成完成</h3>
      <p id="modalText">图片已经生成完成。</p>
      <button class="primary" id="modalOk">知道了</button>
    </div>
  </div>

    $("date").value=new Date().toISOString().slice(0,10);$("apiKey").value=cleanApiKey(localStorage.getItem(storeKey)||legacyKey);$("baseUrl").value=localStorage.getItem(baseStoreKey)||$("baseUrl").value;setModel(localStorage.getItem(modelStoreKey)||$("model").value);if(!$("apiKey").value&&legacyKey)setImageKey(legacyKey);$("apiKey").addEventListener("input",()=>setImageKey($("apiKey").value));$("apiKey").addEventListener("blur",()=>setImageKey($("apiKey").value));$("baseUrl").addEventListener("input",()=>localStorage.setItem(baseStoreKey,$("baseUrl").value.trim()));$("model").addEventListener("change",()=>localStorage.setItem(modelStoreKey,$("model").value));window.addEventListener("message",event=>{if(event.origin!==location.origin)return;if(event.data?.type==="shared-api-keys"){setImageKey(event.data.imageApiKey||"");if(event.data.imageBaseUrl){$("baseUrl").value=event.data.imageBaseUrl;localStorage.setItem(baseStoreKey,event.data.imageBaseUrl)}if(event.data.imageModel)setModel(event.data.imageModel)}});$("clearKey").onclick=()=>{localStorage.removeItem(storeKey);localStorage.removeItem(legacyStoreKey);$("apiKey").value="";$("status").textContent="已清除本地图片 Key"};["columns","copyCount","imageAt","imagePosition","imageType","titleType","copyType","title","customCopy","modeArticle","modeSticker","sizeMode","customWidth","customHeight"].forEach(id=>$(id).addEventListener("input",()=>{updateMode();renderArticle()}));
    function mode(){return $("modeSticker").checked?"sticker":"article"}
    function updateMode(){document.body.classList.toggle("is-sticker",mode()==="sticker");document.body.classList.toggle("is-article",mode()==="article");document.body.classList.toggle("is-custom-size",$("sizeMode").value==="custom");$("summary").textContent=mode()==="sticker"?"贴图模式：只输出图片和文案":"文章模式：输出文章 HTML"}
    function resolveTypes(){lastResolved={image:$("imageType").value==="random"?pick(concreteImageTypes):$("imageType").value,title:$("titleType").value==="random"?pick(concreteTitleTypes):$("titleType").value,copy:$("copyType").value==="random"?pick(concreteCopyTypes):$("copyType").value};return lastResolved}
    function weekdayText(v){return["星期日","星期一","星期二","星期三","星期四","星期五","星期六"][new Date(v+"T00:00:00").getDay()]}function cnDate(v){const d=new Date(v+"T00:00:00");return`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${weekdayText(v)}`}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
    function currentTitle(types=lastResolved){return $("title").value.trim()||pick(titlePools[types.title]||titlePools.morning)}
    function currentCopies(types=lastResolved){const custom=$("customCopy").value.trim();if(custom)return custom.split(/\n+/).map(x=>x.trim()).filter(Boolean);const pool=copyPools[types.copy]||copyPools.warm,count=Math.max(1,Math.min(8,Number($("copyCount").value||3)));let arr=[];while(arr.length<count)arr.push(...sample(pool,pool.length));return arr.slice(0,count)}
    function articleTitle(types=lastResolved){return`${$("count").value||1}张${imageTypeData[types.image].name}图 | 新的一天，愿你喜乐平安`}
    function imageSize(){if($("sizeMode").value==="3:4")return"1024x1365";if($("sizeMode").value==="9:16")return"2160x3840";return`${Math.max(256,Number($("customWidth").value||1024))}x${Math.max(256,Number($("customHeight").value||1365))}`}
    function imageRatio(){if($("sizeMode").value==="3:4")return"3 / 4";if($("sizeMode").value==="9:16")return"9 / 16";return`${Math.max(1,Number($("customWidth").value||1024))} / ${Math.max(1,Number($("customHeight").value||1365))}`}
    function gridHtml(placeholder=false){const cols=mode()==="sticker"?Math.min(4,Number($("count").value||4)):$("columns").value,ratio=imageRatio(),imgs=generatedImages.map((img,i)=>`<img src="${img.src}" alt="生成图 ${i+1}" style="aspect-ratio:${ratio}">`).join("");return placeholder&&!imgs?`<div class="image-grid placeholder" style="--cols:${cols}">图片将插入在这里 · ${mode()==="sticker"?"贴图模式自动排列":`每行 ${cols} 张`}</div>`:`<div class="image-grid" style="--cols:${cols}">${imgs}</div>`}
    function renderArticle(){const types=lastResolved,copies=currentCopies(types);$("articleTitle").textContent=mode()==="sticker"?`${$("count").value||1}张${imageTypeData[types.image].name}贴图 + ${copies.length}条文案`:articleTitle(types);let html="";if(mode()==="sticker"){html+=gridHtml(true);html+=`<p class="ending">文案</p>`+copies.map((p,i)=>`<p>${i+1}. ${escapeHtml(p)}</p>`).join("");$("articleBody").innerHTML=html;return}const at=Math.max(1,Math.min(copies.length,Number($("imageAt").value||1))),pos=$("imagePosition").value;copies.forEach((p,i)=>{const n=i+1;if(n===at&&pos==="before")html+=gridHtml(true);html+=`<p>${escapeHtml(p)}</p>`;if(n===at&&pos==="after")html+=gridHtml(true)});$("articleBody").innerHTML=html}
    function variationText(index){const v=variationSets[(index-1)%variationSets.length];return`本张是第 ${index} 张，必须与同批其他图片明显不同：服装=${v.clothes}；姿势=${v.pose}；动作=${v.action}；场景=${v.scene}；镜头=${v.lens}。同一批图片禁止重复同款衣服、同样捧花姿势、同一亭台/荷塘背景。人物气质保持统一：端庄、亲和、自然、明亮。`}
    function promptText(index=1){const types=index===1?resolveTypes():lastResolved,type=imageTypeData[types.image],rawTitle=currentTitle(types),title=rawTitle.includes("早安")?rawTitle:`早安 ${rawTitle}`,copies=currentCopies(types),copy=copies[(index-1)%copies.length]||copies[copies.length-1]||"愿你平安健康，喜乐常伴。",showDate=$("showDate").checked,lunarLine=$("showLunar").checked?'第三行小字写："农历今日吉祥"。\\n':"",writeBlock=showDate?`第一行主标题必须写："早安" 两个大字，可搭配副标题："${title}"。\\n第二行日期写："${cnDate($("date").value)}"。\\n${lunarLine}底部祝福语写："${copy}"。`:`第一行主标题必须写："早安" 两个大字，可搭配副标题："${title}"。\\n底部祝福语写："${copy}"。`,els=sample(elements,3).join("、");return`你是一名专业中文祝福海报视觉设计师。
请直接生成一张完整的中文祝福海报，适合微信群、朋友圈、公众号分享。

图片类型：${type.name}
自定义补充：${$("customType").value.trim()||"无"}

核心要求：
1. 一定要把中文文案直接生成在图片里，不要留给后期添加。

3. ${type.rule}
4. 图片顶部或视觉中心必须清楚出现“早安”两个中文大字，不能写成晚安、午安、慢慢来、每日金句等其他主标题。
5. 画面不要任何外边框、描边框、金色边框、国风角花边框、相框、卡片边框，图片四周保持自然完整画面。
6. 竖版海报，适合手机观看，参考尺寸 ${imageSize()}，画面比例为 ${$("sizeMode").value}。

画面设定：
- 场景环境：${pick(type.scenes)}
- 主体内容：${pick(type.subjects)}
- 辅助元素：${els}
- 风格：温暖、明亮、吉祥、自然、高清、耐看
- 构图：主体清晰，文字区域干净，年轻成年女性为主要视觉中心；底部祝福语不能压住主体；不要边框式排版
- 批量差异要求：${variationText(index)}

必须写入图片中的文案如下：
${writeBlock}

禁止出现：

- 水印、logo、签名、二维码

- ${showDate?"必须准确写入日期，不要改写。":"绝对禁止出现任何日期、星期、农历、年月日、阿拉伯数字、今天、今日、时间、日历等信息。"}`}
    function setProgress(done,total){$("progressWrap").hidden=false;$("progressBar").style.width=`${total?Math.round(done/total*100):0}%`;$("summary").textContent=`${done}/${total} 张`}
    function resetProgress(){ $("progressWrap").hidden=true;$("progressBar").style.width="0" }
    function setGenerating(on){isGenerating=on;$("generateBtn").disabled=on;$("previewBtn").disabled=on;$("cancelBtn").hidden=!on}
    function showModal(title,text){$("modalTitle").textContent=title;$("modalText").textContent=text;$("doneModal").hidden=false}
    $("modalOk").onclick=()=>{$("doneModal").hidden=true};
    $("doneModal").onclick=e=>{if(e.target===$("doneModal"))$("doneModal").hidden=true};
    $("cancelBtn").onclick=()=>{if(activeController){$("status").textContent="正在取消，请稍等";activeController.abort()}};
    function apiEndpoint(base){if(location.protocol==="http:"||location.protocol==="https:")return"/api/images/generations";return(base.endsWith("/v1")?base:base+"/v1")+"/images/generations"}
    function friendlyFetchError(e){if(e&&e.message==="Failed to fetch")return"请求没有发出去。当前图片接口不允许浏览器跨域直连，请用本地服务版打开页面：运行 start.bat 后访问 http://127.0.0.1:8787/";return e.message||String(e)}
    function normalizeImageSrc(value,base){if(typeof value!=="string")return null;const s=value.trim();if(!s||/\/images\/tasks\//i.test(s))return null;if(/^data:image\//i.test(s))return{src:s,publicUrl:false};const md=s.match(/!\[[^\]]*]\((https?:\/\/[^)\s]+)\)/i);if(md&&!/\/images\/tasks\//i.test(md[1]))return{src:md[1],publicUrl:true};if(/^https?:\/\/.+/i.test(s)&&/\.(png|jpe?g|webp|gif)(\?|#|$)|\/images\/assets|\/image\/|\/file|\/files|\/download/i.test(s))return{src:s,publicUrl:true};if(/^\/[^/]/.test(s)&&base){try{return{src:new URL(s,base).href,publicUrl:true}}catch{} }if(s.length>500&&/^[A-Za-z0-9+/=]+$/.test(s))return{src:"data:image/png;base64,"+s,publicUrl:false};return null}
    function extractImage(data,base){const seen=new Set(),priority=["url","image_url","imageUrl","b64_json","base64","image_base64","image","result","result_url","output_url","file_url"];function walk(node){if(!node||seen.has(node))return null;if(typeof node==="string")return normalizeImageSrc(node,base);if(typeof node!=="object")return null;seen.add(node);for(const key of priority){if(key in node){const found=normalizeImageSrc(node[key],base)||walk(node[key]);if(found)return found}}if(Array.isArray(node)){for(const item of node){const found=walk(item);if(found)return found}}else{for(const key of Object.keys(node)){const found=walk(node[key]);if(found)return found}}return null}return walk(data)}
    function responseErrorText(data){if(!data||typeof data!=="object")return"";const err=data.error;if(typeof err==="string")return err;if(err&&typeof err==="object")return err.message||err.code||JSON.stringify(err).slice(0,300);return data.message||data.msg||data.detail||""}
    async function callApi(prompt,signal){const key=getApiKey(),base=$("baseUrl").value.trim().replace(/\/$/,""),useProxy=location.protocol==="http:"||location.protocol==="https:",url=apiEndpoint(base),body={model:$("model").value,prompt,size:imageSize(),n:1};if(useProxy)body.baseUrl=base;const headers={"Content-Type":"application/json"};if(useProxy)body.apiKey=key;else headers.Authorization=`Bearer ${key}`;let res;try{res=await fetch(url,{method:"POST",headers,body:JSON.stringify(body),signal})}catch(e){throw new Error(friendlyFetchError(e))}const text=await res.text();let data;try{data=JSON.parse(text||"{}")}catch{const head=text.trim().slice(0,120);if(/^<!doctype|^<html/i.test(head))throw new Error(`本站 /api/images/generations 没有返回 JSON，可能是浏览器缓存了旧页面、部署入口不对，或反向代理没有转到 FastAPI。请刷新页面后重试。HTTP ${res.status}，响应开头：${head||"空响应"}`);throw new Error(`接口返回不是 JSON。HTTP ${res.status}，响应开头：${head||"空响应"}`)}const apiErr=responseErrorText(data);if(!res.ok||apiErr)throw new Error(`HTTP ${res.status}: ${apiErr||text.slice(0,300)}`);const image=extractImage(data,base);if(image)return image;throw new Error(`接口返回中没有图片数据。返回字段：${Object.keys(data||{}).join("、")||"空响应"}`)}
    function wechatGridHtml(){const cols=Number($("columns").value),width=Math.max(1,Math.floor(100/cols)-1);return generatedImages.map((img,i)=>{const mr=(i+1)%cols===0?"0":"1%";return`<img src="${img.src}" style="display:inline-block;width:${width}%;max-width:${width}%;height:auto;margin:0 ${mr} 12px 0;border:0;outline:none;padding:0;border-radius:8px;" />`}).join("")}
    function wechatHtml(){const copies=currentCopies(lastResolved),at=Math.max(1,Math.min(copies.length,Number($("imageAt").value||1))),pos=$("imagePosition").value;let body="";copies.forEach((p,i)=>{const n=i+1;if(n===at&&pos==="before")body+=`<section style="text-align:left;font-size:0;line-height:0;white-space:normal;margin:22px 0;">${wechatGridHtml()}</section>`;body+=`<p style="font-size:17px;line-height:1.9;margin:0 0 18px;">${escapeHtml(p)}</p>`;if(n===at&&pos==="after")body+=`<section style="text-align:left;font-size:0;line-height:0;white-space:normal;margin:22px 0;">${wechatGridHtml()}</section>`});return`<section style="max-width:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#26343b;line-height:1.9;"><h2 style="text-align:center;color:#338ba8;font-size:26px;line-height:1.35;margin:0 0 22px;">${escapeHtml(articleTitle(lastResolved))}</h2>${body}</section>`}
    function warnIfNeeded(){const hasData=generatedImages.some(x=>!x.publicUrl);$("copyWarn").hidden=false;$("copyWarn").textContent=hasData?"注意：当前接口返回的是 base64 图片。公众号后台通常会过滤这种图片，所以复制 HTML 可能仍然没图。请先下载图片，再在公众号后台手动上传；或换成返回公网 URL 的图片接口/上传到公众号素材库。":"当前图片是公网 URL，复制到公众号后台更可能保留图片；若微信仍过滤，请先上传到公众号素材库。"}
    function downloadText(name,text,type="text/plain;charset=utf-8"){const blob=new Blob([text],{type}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}
    function stickerText(){const copies=currentCopies(lastResolved);return `${$("count").value||1}张${imageTypeData[lastResolved.image].name}贴图文案\n\n`+copies.map((p,i)=>`${i+1}. ${p}`).join("\n\n")}
    function imagesManifest(){return "图片下载说明\n\n静态网页不能直接把多张远程图打包成 zip。请在页面预览区右键图片另存，或逐个打开图片保存。\n\n"+generatedImages.map((img,i)=>`图片${i+1}: ${img.publicUrl?img.src:"base64 图片，需在页面中右键保存"}`).join("\n")}
    $("previewBtn").onclick=()=>{const p=promptText(1);$("prompt").hidden=false;$("prompt").textContent=p;renderArticle();$("status").textContent=`提示词已生成 · 随机结果：${imageTypeData[lastResolved.image].name}`};
    $("generateBtn").onclick=async()=>{if(isGenerating)return;activeController=new AbortController();setGenerating(true);generatedImages=[];const firstPrompt=promptText(1);$("prompt").hidden=false;$("prompt").textContent=firstPrompt;renderArticle();const count=Math.max(1,Math.min(8,Number($("count").value||1)));setProgress(0,count);try{for(let i=1;i<=count;i++){$("status").textContent=`正在生成第 ${i}/${count} 张`;generatedImages.push(await callApi(i===1?firstPrompt:promptText(i),activeController.signal));renderArticle();setProgress(i,count)}$("status").textContent="生成完成";$("summary").textContent=mode()==="sticker"?`${count} 张贴图 · ${currentCopies(lastResolved).length} 条文案`:`${count} 张 · ${$("copyCount").value} 条文案 · 每行 ${$("columns").value} 张`;warnIfNeeded();showModal("生成完成",`已生成 ${count} 张图片，${mode()==="sticker"?"可以下载文案和图片说明。":"可以复制公众号 HTML 或下载 HTML。"}`)}catch(e){if(e.name==="AbortError"){$("status").textContent=`已取消，保留已生成的 ${generatedImages.length} 张`;setProgress(generatedImages.length,count);showModal("已取消",`本次生成已停止，当前保留 ${generatedImages.length} 张已完成图片。`)}else{const msg=friendlyFetchError(e);$("status").textContent=msg;showModal("生成失败",msg)}}finally{activeController=null;setGenerating(false)}};
    $("copyHtmlBtn").onclick=async()=>{await navigator.clipboard.writeText(wechatHtml());$("status").textContent="公众号 HTML 已复制";warnIfNeeded()};
    $("downloadHtmlBtn").onclick=()=>{downloadText("公众号图文.html",wechatHtml(),"text/html;charset=utf-8");warnIfNeeded()};
    $("downloadTextBtn").onclick=()=>downloadText("贴图文案.txt",stickerText());
    $("downloadImagesBtn").onclick=()=>downloadText("图片下载说明.txt",imagesManifest());
    resolveTypes();updateMode();renderArticle();
  </script>

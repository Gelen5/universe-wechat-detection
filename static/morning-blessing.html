<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>早安祝福 · 宇宙第一工作台</title>
  <link rel="stylesheet" href="/static/style.css?v=20260831-morning">
  <link rel="stylesheet" href="/static/taste-chatgpt.css?v=20260831-morning">
  <link rel="stylesheet" href="/static/admin.css?v=20260831-morning">
  <link rel="stylesheet" href="/static/glass-theme.css?v=20260831-morning">
  <style>
    /* 仅保留 JS 动态显隐控制，视觉样式由 glass-theme.css 统一提供 */
    .is-sticker .article-only { display:none !important; }
    .is-article #downloadTextBtn, .is-article #downloadImagesBtn { display:none !important; }
    .is-sticker #copyHtmlBtn, .is-sticker #downloadHtmlBtn { display:none !important; }
    .custom-size { display:none !important; }
    .is-custom-size .custom-size { display:grid !important; }
    [hidden] { display:none !important; }
  </style>
</head>
<body class="morning-iframe is-article">
  <header class="morning-topbar">
    <div>
      <h1>早安祝福</h1>
      <div class="sub">图片与文案一键生成</div>
    </div>
    <span class="badge">平台 API · 积分计费</span>
  </header>

  <main class="morning-workbench">
    <aside class="morning-panel morning-controls">
      <div class="morning-section-title">输出模式</div>
      <div class="morning-seg">
        <input id="modeArticle" name="mode" type="radio" value="article" checked>
        <label for="modeArticle">文章</label>
        <input id="modeSticker" name="mode" type="radio" value="sticker">
        <label for="modeSticker">贴图</label>
      </div>

      <div class="morning-section-title">模型服务</div>
      <div class="morning-hint">图片模型由平台统一托管。每生成一张图片扣除 30 积分，失败自动退还。</div>
      <input id="apiKey" type="hidden">
      <input id="baseUrl" type="hidden" value="">
      <select id="model" hidden><option selected>gpt-image-2</option></select>

      <div class="morning-section-title">类型（默认随机）</div>
      <div class="morning-field-row cols-3">
        <div><label for="imageType">图片类型</label><select id="imageType"><option value="random">随机</option><option value="beauty" selected>美女早安</option><option value="flower">花卉山水</option><option value="guofeng">国风吉祥</option><option value="health">养生健康</option><option value="festival">节日节气</option><option value="night">晚安祝福</option><option value="quote">每日金句</option><option value="custom">自定义</option></select></div>
        <div><label for="titleType">标题类型</label><select id="titleType"><option value="random">随机</option><option value="morning" selected>早安问候</option><option value="luck">好运福气</option><option value="health">健康平安</option><option value="festival">节日节气</option><option value="quote">金句标题</option><option value="custom">自定义</option></select></div>
        <div><label for="copyType">文案类型</label><select id="copyType"><option value="random">随机</option><option value="warm" selected>温柔问候</option><option value="health">健康祝福</option><option value="luck">好运福气</option><option value="moments">朋友圈长文</option><option value="wechat">公众号短文</option><option value="custom">自定义</option></select></div>
      </div>
      <div class="morning-field-row" style="margin-top:10px">
        <label for="customType">自定义类型补充</label>
        <input id="customType" placeholder="例如：佛系莲花、妈妈群祝福、节气海报">
      </div>

      <div class="morning-section-title">内容</div>
      <div class="morning-field-row cols-2">
        <div><label for="title">主标题</label><input id="title" placeholder="留空则按标题类型随机"></div>
        <div><label for="date">日期</label><input id="date" type="date"></div>
      </div>
      <div class="morning-field-row" style="margin-top:10px">
        <label for="customCopy">自定义文案（可选，每行或空行分隔为一条）</label>
        <textarea id="customCopy" placeholder="留空则按文案类型自动生成多条文案"></textarea>
      </div>
      <div class="morning-checks">
        <label class="morning-check"><input id="showDate" type="checkbox" checked> 显示日期</label>
        <label class="morning-check"><input id="showLunar" type="checkbox" checked> 显示农历</label>
      </div>

      <div class="morning-section-title article-only">文案与图片位置</div>
      <div class="morning-field-row cols-3 article-only">
        <div><label for="copyCount">本次生成文案条数</label><input id="copyCount" type="number" min="1" max="8" value="3"></div>
        <div><label for="imageAt">图片插入到第几条</label><input id="imageAt" type="number" min="1" max="8" value="2"></div>
        <div><label for="imagePosition">图片在文案的</label><select id="imagePosition"><option value="after" selected>下方</option><option value="before">上方</option></select></div>
      </div>

      <div class="morning-section-title">生成与排版</div>
      <div class="morning-field-row cols-3">
        <div><label for="count">生成图片张数</label><input id="count" type="number" min="1" max="8" value="4"></div>
        <div class="article-only"><label for="columns">每行图片数</label><select id="columns"><option>1</option><option>2</option><option>3</option><option selected>4</option></select></div>
        <div><label for="sizeMode">图片比例</label><select id="sizeMode"><option value="3:4" selected>3:4 竖图</option><option value="9:16">9:16 手机竖图</option><option value="custom">自定义</option></select></div>
      </div>
      <div class="morning-field-row cols-2 custom-size" style="margin-top:10px">
        <div><label for="customWidth">自定义宽</label><input id="customWidth" type="number" min="256" max="4096" value="1024"></div>
        <div><label for="customHeight">自定义高</label><input id="customHeight" type="number" min="256" max="4096" value="1365"></div>
      </div>

      <div class="morning-actions">
        <button id="previewBtn" type="button">预览提示词</button>
        <button id="generateBtn" class="primary" type="button">开始生成</button>
        <button id="cancelBtn" class="danger" type="button" hidden>取消生成</button>
        <button id="copyHtmlBtn" type="button">复制公众号HTML</button>
        <button id="downloadHtmlBtn" type="button">下载HTML</button>
        <button id="downloadTextBtn" type="button">下载文案TXT</button>
        <button id="downloadImagesBtn" type="button">下载图片说明</button>
      </div>
      <div id="copyWarn" class="morning-warn" hidden></div>
    </aside>

    <section class="morning-panel morning-preview">
      <div class="morning-status">
        <span id="status">就绪</span>
        <span id="summary">文章模式：输出文章 HTML</span>
        <div class="morning-progress-wrap" id="progressWrap" hidden><div class="morning-progress-bar" id="progressBar"></div></div>
      </div>
      <div id="prompt" class="morning-prompt" hidden></div>
      <article id="article" class="morning-article"><h2 id="articleTitle"></h2><div id="articleBody"></div></article>
    </section>
  </main>

  <div class="modal-mask" id="doneModal" hidden>
    <div class="modal">
      <h3 id="modalTitle">生成完成</h3>
      <p id="modalText">图片已经生成完成。</p>
      <button class="primary" id="modalOk">知道了</button>
    </div>
  </div>

  <script>
    const $=id=>document.getElementById(id),pick=a=>a[Math.floor(Math.random()*a.length)],sample=(a,n)=>[...a].sort(()=>Math.random()-.5).slice(0,n),storeKey="shared_image_api_key_v1",baseStoreKey="shared_image_base_url_v1",modelStoreKey="shared_image_model_v1",legacyStoreKey="image_api_key_v3";
    const concreteImageTypes=["beauty","flower","guofeng","health","festival","quote"],concreteTitleTypes=["morning","luck","health","festival","quote"],concreteCopyTypes=["warm","health","luck","moments","wechat"];

    const titlePools={morning:["早安吉祥","早上好","清晨问候","新的一天 早安"],luck:["天天好运来","福气满满","吉祥如意","好运常伴"],health:["幸福安康","平安就是福","愿你安康","健康平安"],festival:["节日安康","节气吉祥","顺时安好","岁时有福"],quote:["心有阳光 一路芬芳","慢慢来 也很好","把日子过成喜欢的样子"],custom:["早安吉祥"]};

    const variationSets=[
      {clothes:"米白色端庄旗袍或浅色连衣裙",pose:"正面微笑手捧鲜花",action:"轻轻递出早安祝福卡",scene:"清晨中式庭院花树旁",lens:"半身近景"},
      {clothes:"浅蓝色国风上衣或温柔长裙",pose:"侧身回眸微笑",action:"手持茶杯或花篮",scene:"湖边晨光与荷花旁",lens:"中景人像"},
      {clothes:"淡粉色优雅裙装",pose:"站姿自然看向镜头",action:"整理花束或轻扶花枝",scene:"阳台花架与朝霞前",lens:"全身构图"},
      {clothes:"浅绿色清新套装",pose:"坐在窗前微笑",action:"端起热茶问候",scene:"窗前茶桌与晨光中",lens:"生活感中近景"},

      {clothes:"暖黄色温柔针织或裙装",pose:"自然行走回头微笑",action:"漫步花园小径",scene:"花海小径与阳光光束中",lens:"动态抓拍感"},
      {clothes:"白色简洁长裙",pose:"安静坐姿微笑",action:"翻看祝福卡片",scene:"露台花园与远山前",lens:"留白海报构图"}
    ];
    let generatedImages=[],lastResolved={image:"beauty",title:"morning",copy:"warm"},activeController=null,isGenerating=false;
    function cleanApiKey(value){return String(value||"").replace(/[\s\u00a0\u200b-\u200d\ufeff]/g,"")}
    function getApiKey(){return ""}
    function setImageKey(value){const cleaned=cleanApiKey(value);$("apiKey").value=cleaned;if(cleaned)localStorage.setItem(storeKey,cleaned);else localStorage.removeItem(storeKey)}
    function setModel(value){const cleaned=String(value||"").trim();if(!cleaned)return;let option=[...$("model").options].find(item=>item.value===cleaned);if(!option){option=document.createElement("option");option.value=cleaned;option.textContent=cleaned;$("model").appendChild(option)}$("model").value=cleaned;localStorage.setItem(modelStoreKey,cleaned)}
    const legacyKey=cleanApiKey(localStorage.getItem(legacyStoreKey)||"");
    $("date").value=new Date().toISOString().slice(0,10);setModel($("model").value);window.addEventListener("message",event=>{if(event.origin!==location.origin)return;if(event.data?.type==="shared-api-keys"&&event.data.imageModel)setModel(event.data.imageModel)});["columns","copyCount","imageAt","imagePosition","imageType","titleType","copyType","title","customCopy","modeArticle","modeSticker","sizeMode","customWidth","customHeight"].forEach(id=>$(id).addEventListener("input",()=>{updateMode();renderArticle()}));
    function mode(){return $("modeSticker").checked?"sticker":"article"}

    function resolveTypes(){lastResolved={image:$("imageType").value==="random"?pick(concreteImageTypes):$("imageType").value,title:$("titleType").value==="random"?pick(concreteTitleTypes):$("titleType").value,copy:$("copyType").value==="random"?pick(concreteCopyTypes):$("copyType").value};return lastResolved}
    function weekdayText(v){return["星期日","星期一","星期二","星期三","星期四","星期五","星期六"][new Date(v+"T00:00:00").getDay()]}function cnDate(v){const d=new Date(v+"T00:00:00");return`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${weekdayText(v)}`}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
    function currentTitle(types=lastResolved){return $("title").value.trim()||pick(titlePools[types.title]||titlePools.morning)}
    function currentCopies(types=lastResolved){const custom=$("customCopy").value.trim();if(custom)return custom.split(/\n+/).map(x=>x.trim()).filter(Boolean);const pool=copyPools[types.copy]||copyPools.warm,count=Math.max(1,Math.min(8,Number($("copyCount").value||3)));let arr=[];while(arr.length<count)arr.push(...sample(pool,pool.length));return arr.slice(0,count)}

    function imageRatio(){if($("sizeMode").value==="3:4")return"3 / 4";if($("sizeMode").value==="9:16")return"9 / 16";return`${Math.max(1,Number($("customWidth").value||1024))} / ${Math.max(1,Number($("customHeight").value||1365))}`}
    function gridHtml(placeholder=false){const cols=mode()==="sticker"?Math.min(4,Number($("count").value||4)):$("columns").value,ratio=imageRatio(),imgs=generatedImages.map((img,i)=>`<img src="${img.src}" alt="生成图 ${i+1}" style="aspect-ratio:${ratio}">`).join("");return placeholder&&!imgs?`<div class="image-grid placeholder" style="--cols:${cols}">图片将插入在这里 · ${mode()==="sticker"?"贴图模式自动排列":`每行 ${cols} 张`}</div>`:`<div class="image-grid" style="--cols:${cols}">${imgs}</div>`}

图片类型：${type.name}

3. ${type.rule}
4. 图片顶部或视觉中心必须清楚出现“早安”两个中文大字，不能写成晚安、午安、慢慢来、每日金句等其他主标题。
5. 画面不要任何外边框、描边框、金色边框、国风角花边框、相框、卡片边框，图片四周保持自然完整画面。
6. 竖版海报，适合手机观看，参考尺寸 ${imageSize()}，画面比例为 ${$("sizeMode").value}。

画面设定：
- 场景环境：${pick(type.scenes)}
- 主体内容：${pick(type.subjects)}
- 辅助元素：${els}
- 风格：温暖、明亮、吉祥、自然、高清、耐看
- 构图：主体清晰，文字区域干净，年轻成年女性为主要视觉中心；底部祝福语不能压住主体；不要边框式排版
- 批量差异要求：${variationText(index)}

必须写入图片中的文案如下：
${writeBlock}

禁止出现：
- 多余文字、英文、拼音、乱码、错别字，尤其禁止把主标题写成“晚安”“午安”“慢慢来”“也很好”
- 水印、logo、签名、二维码
- 外边框、金色边框、国风角花边框、相框、装饰边框、底部卡片边框
- 暴露服装、性感姿势、擦边内容、未成年人形象、幼态形象
- 暗黑压抑、赛博朋克、怪异抽象
- 低清晰度、模糊、重影、文字难辨认
- ${showDate?"必须准确写入日期，不要改写。":"绝对禁止出现任何日期、星期、农历、年月日、阿拉伯数字、今天、今日、时间、日历等信息。"}`}
    function setProgress(done,total){$("progressWrap").hidden=false;$("progressBar").style.width=`${total?Math.round(done/total*100):0}%`;$("summary").textContent=`${done}/${total} 张`}
    function resetProgress(){ $("progressWrap").hidden=true;$("progressBar").style.width="0" }
    function setGenerating(on){isGenerating=on;$("generateBtn").disabled=on;$("previewBtn").disabled=on;$("cancelBtn").hidden=!on}
    function showModal(title,text){$("modalTitle").textContent=title;$("modalText").textContent=text;$("doneModal").hidden=false}
    $("modalOk").onclick=()=>{$("doneModal").hidden=true};
    $("doneModal").onclick=e=>{if(e.target===$("doneModal"))$("doneModal").hidden=true};
    $("cancelBtn").onclick=()=>{if(activeController){$("status").textContent="正在取消，请稍等";activeController.abort()}};
    function friendlyFetchError(e){if(e&&e.message==="Failed to fetch")return"请求没有发出去。当前图片接口不允许浏览器跨域直连，请用本地服务版打开页面：运行 start.bat 后访问 http://127.0.0.1:8787/";return e.message||String(e)}
    function normalizeImageSrc(value,base){if(typeof value!=="string")return null;const s=value.trim();if(!s||/\/images\/tasks\//i.test(s))return null;if(/^data:image\//i.test(s))return{src:s,publicUrl:false};const md=s.match(/!\[[^\]]*]\((https?:\/\/[^)\s]+)\)/i);if(md&&!/\/images\/tasks\//i.test(md[1]))return{src:md[1],publicUrl:true};if(/^https?:\/\/.+/i.test(s)&&/\.(png|jpe?g|webp|gif)(\?|#|$)|\/images\/assets|\/image\/|\/file|\/files|\/download/i.test(s))return{src:s,publicUrl:true};if(/^\/[^/]/.test(s)&&base){try{return{src:new URL(s,base).href,publicUrl:true}}catch{} }if(s.length>500&&/^[A-Za-z0-9+/=]+$/.test(s))return{src:"data:image/png;base64,"+s,publicUrl:false};return null}
    function extractImage(data,base){const seen=new Set(),priority=["url","image_url","imageUrl","b64_json","base64","image_base64","image","result","result_url","output_url","file_url"];function walk(node){if(!node||seen.has(node))return null;if(typeof node==="string")return normalizeImageSrc(node,base);if(typeof node!=="object")return null;seen.add(node);for(const key of priority){if(key in node){const found=normalizeImageSrc(node[key],base)||walk(node[key]);if(found)return found}}if(Array.isArray(node)){for(const item of node){const found=walk(item);if(found)return found}}else{for(const key of Object.keys(node)){const found=walk(node[key]);if(found)return found}}return null}return walk(data)}
    function responseErrorText(data){if(!data||typeof data!=="object")return"";const err=data.error;if(typeof err==="string")return err;if(err&&typeof err==="object")return err.message||err.code||JSON.stringify(err).slice(0,300);return data.message||data.msg||data.detail||""}
    async function callApi(prompt,signal){const base=$("baseUrl").value.trim().replace(/\/$/,""),body={model:$("model").value,prompt,size:imageSize(),n:1},headers={"Content-Type":"application/json"};if(!(location.protocol==="http:"||location.protocol==="https:"))throw new Error("请从宇宙第一工作台中打开此功能");let res;try{res=await fetch("/api/tasks",{method:"POST",headers,body:JSON.stringify({type:"morning_image",idempotency_key:crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`,payload:body}),signal})}catch(e){throw new Error(friendlyFetchError(e))}let accepted;try{accepted=await res.json()}catch{throw new Error("任务提交接口没有返回 JSON，请刷新页面后重试")};if(!res.ok)throw new Error(accepted.detail||accepted.message||`HTTP ${res.status}: 任务提交失败`);const jobId=accepted.job&&accepted.job.id;if(!jobId)throw new Error("任务未返回编号");const cancel=()=>fetch(`/api/tasks/${jobId}/cancel`,{method:"POST"}).catch(()=>undefined);signal&&signal.addEventListener("abort",cancel,{once:true});while(true){if(signal&&signal.aborted){cancel();throw new DOMException("已取消","AbortError")}await new Promise(resolve=>setTimeout(resolve,700));let statusRes;try{statusRes=await fetch(`/api/tasks/${jobId}`,{signal})}catch(e){if(signal&&signal.aborted)cancel();throw new Error(friendlyFetchError(e))}const task=await statusRes.json();if(!statusRes.ok)throw new Error(task.detail||"任务状态查询失败");const job=task.job||{};if(job.status==="succeeded"){const image=extractImage(job.result,base);if(image)return image;throw new Error(`接口返回中没有图片数据。返回字段：${Object.keys(job.result||{}).join("、")||"空响应"}`)}if(job.status==="failed"||job.status==="canceled")throw new Error(job.error||"图片任务未完成")}}
    function wechatGridHtml(){const cols=Number($("columns").value),width=Math.max(1,Math.floor(100/cols)-1);return generatedImages.map((img,i)=>{const mr=(i+1)%cols===0?"0":"1%";return`<img src="${img.src}" style="display:inline-block;width:${width}%;max-width:${width}%;height:auto;margin:0 ${mr} 12px 0;border:0;outline:none;padding:0;border-radius:8px;" />`}).join("")}
    function wechatHtml(){const copies=currentCopies(lastResolved),at=Math.max(1,Math.min(copies.length,Number($("imageAt").value||1))),pos=$("imagePosition").value;let body="";copies.forEach((p,i)=>{const n=i+1;if(n===at&&pos==="before")body+=`<section style="text-align:left;font-size:0;line-height:0;white-space:normal;margin:22px 0;">${wechatGridHtml()}</section>`;body+=`<p style="font-size:17px;line-height:1.9;margin:0 0 18px;">${escapeHtml(p)}</p>`;if(n===at&&pos==="after")body+=`<section style="text-align:left;font-size:0;line-height:0;white-space:normal;margin:22px 0;">${wechatGridHtml()}</section>`});return`<section style="max-width:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#26343b;line-height:1.9;"><h2 style="text-align:center;color:#338ba8;font-size:26px;line-height:1.35;margin:0 0 22px;">${escapeHtml(articleTitle(lastResolved))}</h2>${body}</section>`}
    function warnIfNeeded(){const hasData=generatedImages.some(x=>!x.publicUrl);$("copyWarn").hidden=false;$("copyWarn").textContent=hasData?"注意：当前接口返回的是 base64 图片。公众号后台通常会过滤这种图片，所以复制 HTML 可能仍然没图。请先下载图片，再在公众号后台手动上传；或换成返回公网 URL 的图片接口/上传到公众号素材库。":"当前图片是公网 URL，复制到公众号后台更可能保留图片；若微信仍过滤，请先上传到公众号素材库。"}
    function downloadText(name,text,type="text/plain;charset=utf-8"){const blob=new Blob([text],{type}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}
    function stickerText(){const copies=currentCopies(lastResolved);return `${$("count").value||1}张${imageTypeData[lastResolved.image].name}贴图\n\n`+copies.map((p,i)=>`${i+1}. ${p}`).join("\n\n")}
    function imagesManifest(){return "图片下载说明\n\n静态网页不能直接把多张远程图打包成 zip。请在页面预览区右键图片另存，或逐个打开图片保存。\n\n"+generatedImages.map((img,i)=>`图片${i+1}: ${img.publicUrl?img.src:"base64 图片，需在页面中右键保存"}`).join("\n")}
    $("previewBtn").onclick=()=>{const p=promptText(1);$("prompt").hidden=false;$("prompt").textContent=p;renderArticle();$("status").textContent=`提示词已生成 · 随机结果：${imageTypeData[lastResolved.image].name}`};
    $("generateBtn").onclick=async()=>{if(isGenerating)return;activeController=new AbortController();setGenerating(true);generatedImages=[];const firstPrompt=promptText(1);$("prompt").hidden=false;$("prompt").textContent=firstPrompt;renderArticle();const count=Math.max(1,Math.min(8,Number($("count").value||1)));setProgress(0,count);try{for(let i=1;i<=count;i++){$("status").textContent=`正在生成第 ${i}/${count} 张`;generatedImages.push(await callApi(i===1?firstPrompt:promptText(i),activeController.signal));renderArticle();setProgress(i,count)}$("status").textContent="生成完成";$("summary").textContent=mode()==="sticker"?`${count} 张贴图 · ${currentCopies(lastResolved).length} 条文案`:`${count} 张 · ${$("copyCount").value} 条文案 · 每行 ${$("columns").value} 张`;warnIfNeeded();showModal("生成完成",`已生成 ${count} 张图片，${mode()==="sticker"?"可以下载文案和图片说明。":"可以复制公众号 HTML 或下载 HTML。"}`)}catch(e){if(e.name==="AbortError"){$("status").textContent=`已取消，保留已生成的 ${generatedImages.length} 张`;setProgress(generatedImages.length,count);showModal("已取消",`本次生成已停止，当前保留 ${generatedImages.length} 张已完成图片。`)}else{const msg=friendlyFetchError(e);$("status").textContent=msg;showModal("生成失败",msg)}}finally{activeController=null;setGenerating(false)}};
    $("copyHtmlBtn").onclick=async()=>{await navigator.clipboard.writeText(wechatHtml());$("status").textContent="公众号 HTML 已复制";warnIfNeeded()};
    $("downloadHtmlBtn").onclick=()=>{downloadText("公众号图文.html",wechatHtml(),"text/html;charset=utf-8");warnIfNeeded()};
    $("downloadTextBtn").onclick=()=>downloadText("贴图文案.txt",stickerText());
    $("downloadImagesBtn").onclick=()=>downloadText("图片下载说明.txt",imagesManifest());
    resolveTypes();updateMode();renderArticle();
  </script>
</body>
</html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用户与活跃 · 宇宙第一工作台</title><link rel="stylesheet" href="/static/admin-activity.css?v=20261031-registration-1"></head><body>
<main><header><div><a class="back" href="/">← 返回工作台</a><p class="eyebrow">宇宙第一工作台 / 管理中心</p><h1>用户与活跃</h1><p class="muted">看清谁来了、谁在创作，以及任务进行得怎么样。</p></div><button id="refresh">刷新数据</button></header>
<section class="registration-card" aria-labelledby="registration-title">
<div class="registration-content"><p class="eyebrow">宇宙第一工作台 · 生长记录</p><h2 id="registration-title">累计注册用户</h2><div class="registration-number"><strong id="registered-total">—</strong><span>个账号</span></div><p class="registration-copy">让想法，有个开始。</p><div class="registration-actions"><button id="all-registered">查看全部用户 ↗</button><button id="share-registration">截图模式</button></div><p class="registration-scope">全站累计注册账号，不随日期或筛选变化。</p></div>
<div class="registration-orbit" aria-hidden="true"><div class="orbit-ring ring-one"></div><div class="orbit-ring ring-two"></div><div class="orbit-ring ring-three"></div><span class="orbit-dot dot-one"></span><span class="orbit-dot dot-two"></span><div class="orbit-center"><img src="/static/galaxy-logo.svg" alt="" width="72" height="72"><span>Creator OS</span></div></div>
<div class="registration-milestone"><span id="milestone-label">正在读取里程碑…</span><span id="milestone-progress"></span><div class="milestone-track"><i id="milestone-fill"></i></div></div>
</section><section class="controls glass"><nav id="ranges" aria-label="日期范围"><button data-days="1" class="selected">今日</button><button data-days="0">昨日</button><button data-days="7">近 7 天</button><button data-days="30">近 30 天</button></nav><label>从 <input id="start" type="date"></label><label>至 <input id="end" type="date"></label><button id="dates">查询</button><label>账号范围 <select id="role"><option value="user">普通用户</option><option value="all">全部账号</option><option value="admin">管理员</option></select></label></section>
<p id="status" role="status" class="muted">正在读取数据…</p><section id="metrics" class="metrics" aria-label="统计指标"></section>
<section class="charts"><article class="glass"><div class="section-head"><h2>新增与活跃趋势</h2><span class="muted">点击日期查看当天</span></div><p class="legend">浅绿：新增用户 · 深绿：活跃用户</p><div id="trend"></div></article><article class="glass"><h2>功能使用</h2><div id="features"></div></article></section>
<section class="glass listing"><div class="section-head"><nav id="views"><button data-view="users" class="selected">用户明细</button><button data-view="tasks">任务明细</button></nav><span id="filter-label"></span><button id="clear">清除筛选</button></div><div class="filters"><input id="search" type="search" placeholder="搜索邮箱或昵称" aria-label="搜索邮箱或昵称"><select id="metric" aria-label="用户筛选"><option value="all">全部用户</option><option value="new">新增用户</option><option value="active">活跃用户</option><option value="creators">创作用户</option><option value="failed">有失败任务</option></select><select id="sort" aria-label="排序"><option value="active">最近活跃优先</option><option value="new">最新注册优先</option><option value="tasks">任务数量优先</option></select></div><div class="table-scroll"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div><footer><span id="total"></span><div><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div></footer></section><p class="muted footnote" id="coverage"></p></main>
<dialog id="drawer" aria-labelledby="detail-title"><div class="drawer-head"><h2 id="detail-title">用户详情</h2><button id="close" aria-label="关闭详情">×</button></div><div id="detail"></div></dialog>
<dialog id="registration-share" class="share-dialog" aria-labelledby="share-title"><div class="share-toolbar"><span id="share-title">截图模式 · 仅展示汇总数据</span><button id="close-share" aria-label="关闭截图模式">×</button></div><div id="share-card"></div><p class="share-hint">截取卡片区域即可分享，不包含用户邮箱、积分或任务明细。</p></dialog>
<script src="/static/admin-activity.js?v=20261031-registration-1" defer></script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>代理管理</title><link rel="stylesheet" href="/static/agents.css"></head><body><main><a href="/">← 返回工作台</a><h1>代理管理</h1><section><h2>添加代理</h2><form id="add" class="row"><input id="email" type="email" required placeholder="已注册用户的邮箱"><button>开通代理</button></form><p id="message" role="status"></p></section><section><h2>代理列表</h2><div id="agents"></div></section><section><h2 id="order-title">充值记录</h2><p>展示已入账的充值订单；订单金额并非保证等于买家实付金额。退款金额为订单累计退款，请结合实际情况核对结算。</p><div class="estimate"><h3>按天预估结算</h3><p>选择客户付款的日期和分成比例；默认昨天。结果仅供核对，不会记录已结算状态。</p><div class="row"><label>付款日期 <input id="settlement-day" type="date"></label><label>分成比例（%） <input id="settlement-rate" type="number" min="0" max="100" step="0.01" value="40"></label><button id="estimate" type="button">计算</button></div><p id="estimate-result" role="status">请先选择代理。</p><p>按所选日期订单金额减去这些订单当前累计退款预估，非实际付款额。其他日期订单发生的退款不在本次计算中；退款可能在结算后发生，须人工补扣，并核对是否已转账，避免重复结算。</p></div><p id="summary"></p><div id="orders">选择一位代理查看。</div><div class="row"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div></section></main><script src="/static/agent-admin.js?v=20261105-estimate"></script></body></html>

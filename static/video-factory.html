<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 视频工厂</title><style>
*{box-sizing:border-box}body.embedded .standalone-back{display:none}body.embedded main{padding-top:0}body{margin:0;background:#f3f5f2;color:#1f3029;font:15px/1.6 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:28px 20px}a{color:#176b54}header{padding:30px;background:#dcece3;border-radius:18px}h1,h2,h3,p{margin:0 0 12px}.tag{display:inline-block;background:#edf6f0;border-radius:20px;padding:2px 9px;font-size:12px}.muted{color:#68796f;font-size:13px}.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(300px,.95fr);gap:18px}.panel,.card{background:white;border:1px solid #dfe8e2;border-radius:12px;padding:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;margin:12px 0 4px}input,select,textarea{width:100%;border:1px solid #cbd9d0;border-radius:8px;padding:10px;font:inherit}textarea{min-height:110px}button{border:0;border-radius:8px;background:#176b54;color:white;padding:10px 14px;cursor:pointer}button.secondary{background:#e3ece6;color:#264535}button:disabled{background:#c8d0cc;color:#69756f;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.notice{min-height:24px;color:#a64d36}.progress{height:10px;background:#e9efeb;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#176b54;transition:width .25s}.steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.steps span{font-size:12px;padding:4px 8px;border-radius:999px;background:#edf3ef;color:#587064}.steps span.done{background:#d5ecdf;color:#176b54}video{width:100%;max-height:600px;background:#101816;border-radius:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.5 inherit;background:#f5f8f6;padding:12px;border-radius:8px;max-height:240px;overflow:auto}@media(max-width:800px){main{padding:14px}.grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}header{padding:22px}}
</style></head><body><script>if(new URLSearchParams(location.search).get("embed")==="1")document.body.classList.add("embedded");</script><main><a class="standalone-back" href="/">← 返回工作台</a><header><span class="tag">9:16 · 中文口播 · 自动质检</span><h1>AI 视频工厂</h1><p>选择赛道和主题，自动生成文案、分镜、画面、配音、字幕与 MP4。</p><span class="muted" id="price-note">正在读取配置…</span></header><div class="grid"><section class="panel"><h2>创建视频</h2><form id="form"><div class="form-grid"><div><label for="category">视频赛道</label><select id="category" name="category"><option value="book">书单</option><option value="history">历史人物</option><option value="folklore">民间故事</option><option value="china">大美中国</option></select></div><div><label for="duration">时长</label><select id="duration" name="duration"><option value="30">30 秒</option><option value="45">45 秒</option><option value="60">60 秒</option></select></div><div><label for="visual_style">视觉风格</label><select id="visual_style" name="visual_style"><option value="auto">自动匹配</option><option value="chinese">国风插画</option><option value="hand_drawn">手绘</option><option value="photo">真实摄影</option></select></div><div><label for="voice_id">中文配音</label><select id="voice_id" name="voice_id"></select></div></div><label for="topic">视频主题</label><input id="topic" name="topic" maxlength="120" required placeholder="例如：曾国藩家书"><label>资料来源（可选）</label><p class="muted">不填写时服务端会先检索公开来源；未核验内容仍会标记为需要人工审核。</p><textarea name="sources" placeholder="每行一条：https://来源地址 | 资料摘要"></textarea><p class="notice" id="notice" role="status"></p><div class="actions"><button id="submit" type="submit">开始生成</button></div></form></section><section class="panel"><h2>任务进度</h2><p class="muted" id="job-meta">尚未创建任务</p><div class="progress"><i id="progress-bar"></i></div><div class="steps" id="steps"></div><div id="result"></div></section></div></main><script src="/static/video-factory.js"></script></body></html>

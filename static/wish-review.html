<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>审核心愿 · 宇宙第一工作台</title><link rel="stylesheet" href="/static/wish-review.css?v=20261101-1"></head><body><main>
<header><div><a href="/admin/users" class="back">← 返回管理中心</a><p>宇宙第一工作台 / 心愿广场</p><h1>审核心愿</h1><span>只有核验通过的心愿会出现在公开广场。</span></div><button id="refresh">刷新列表</button></header>
<section class="glass toolbar"><nav id="filters" aria-label="审核状态"><button data-status="pending" class="selected">待审核</button><button data-status="published">已通过</button><button data-status="rejected">已驳回</button><button data-status="closed">已关闭</button><button data-status="all">全部</button></nav><strong id="count">—</strong></section><p id="status" role="status">正在读取待审核心愿…</p><section id="list" class="review-list"></section>
</main><dialog id="review-dialog" aria-labelledby="dialog-title"><form id="review-form"><header><div><p>审核决定</p><h2 id="dialog-title">—</h2></div><button type="button" id="close" class="close" aria-label="关闭">×</button></header><div id="detail"></div><label>给发布者的备注（驳回时建议说明原因）<textarea id="note" maxlength="500" placeholder="例如：请补充用途或材料后重新提交"></textarea></label><div class="actions"><button type="button" data-decision="closed" class="quiet">关闭</button><button type="button" data-decision="rejected" class="reject">驳回</button><button type="button" data-decision="published" class="approve">通过并公开</button></div><p id="result" role="status"></p></form></dialog><script src="/static/wish-review.js?v=20261101-payment-1" defer></script></body></html>
